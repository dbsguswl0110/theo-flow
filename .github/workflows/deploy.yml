name: Deploy to Cloudflare

# Every push to main (that is, every merged PR) goes live. It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a later push waits for the running one instead of racing it.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning title=Nothing was deployed::Add the CLOUDFLARE_API_TOKEN secret under Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only needed when the token can see more than one Cloudflare account.
          if [ -n "$ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out source
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      # Wrangler 4 refuses to run on anything older than Node 22.
      - name: Set up Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Type check
        if: steps.creds.outputs.ready == 'true'
        run: npm run check

      # The Worker expects the schema this revision ships, so pending migrations go first.
      # Wrangler applies only the ones that have not run yet.
      - name: Apply D1 migrations
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply theo-flow --remote

      - name: Build and deploy
        if: steps.creds.outputs.ready == 'true'
        run: npm run cf:deploy

      - name: Check the live site
        if: steps.creds.outputs.ready == 'true'
        run: |
          base=https://theo-flow.dbsguswl0110.workers.dev
          curl --fail --silent --show-error --retry 5 --retry-delay 4 --retry-all-errors "$base/" -o /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 4 --retry-all-errors "$base/api/folders" -o /dev/null
