name: Mac apps

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'public/assets/teo-pixel-app-icon.png'
      - '.github/workflows/macos.yml'
  # A pull request that touches the Mac code is built too, so a change that does not compile is seen before it merges.
  pull_request:
    paths:
      - 'macos/**'
      - 'public/assets/teo-pixel-app-icon.png'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Apple Silicon runner; the apps target macOS 14 and up.
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and package the app
        run: ./macos/package.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mac-apps
          path: |
            artifacts/macos/TEO-Mac.dmg
            artifacts/macos/TEO.zip
          if-no-files-found: error
          retention-days: 30

      # Installs and starts TEO the way a user would, then reports what macOS makes of it:
      # whether it has no Dock icon, which layer each window sits on (the panel should be at the desktop-icon layer,
      # the web window at the normal one) and whether the widget is registered.
      - name: Start TEO and look at its windows
        continue-on-error: true
        run: |
          mkdir -p artifacts/macos/shots
          cp -R artifacts/macos/TEO.app /Applications/
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/TEO.app
          open /Applications/TEO.app
          sleep 15
          echo "--- process"
          pgrep -fl TEOFlow
          echo "--- application type (UIElement means no Dock icon)"
          lsappinfo list | grep -i -B3 -A12 "theo.flow.macos\"" | head -40 || true
          echo "--- windows"
          swift macos/tools/windows.swift TEO
          echo "--- widget"
          pluginkit -mAvvv -i com.theo.flow.macos.widget
          codesign -d --entitlements - /Applications/TEO.app/Contents/PlugIns/TEOFlowWidget.appex
          screencapture -x artifacts/macos/shots/desktop.png
          ls -l artifacts/macos/shots

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-screenshot
          path: artifacts/macos/shots/
          if-no-files-found: ignore
